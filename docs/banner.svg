<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
  <title id="t">minimal-rootfs</title>
  <desc id="d">A bootable Ubuntu 22.04 or 24.04 root file system built with debootstrap, booted in QEMU and size-checked against a budget on every CI run.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1b2230"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>
  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>
  <rect width="640" height="420" fill="url(#glow)"/>
  <g transform="translate(0 0)">
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="64" y="128" font-size="13" letter-spacing="3" fill="#f472b6" font-weight="600">DEBOOTSTRAP  ·  QEMU  ·  CI</text>
    <text x="62" y="196" font-size="58" font-weight="700" fill="#f0f6fc">minimal-rootfs</text>
    <text x="64" y="244" font-size="22" fill="#9aa7b8">A bootable Ubuntu in 185 MB, built from scratch,</text>
    <text x="64" y="274" font-size="22" fill="#9aa7b8">booted in QEMU and size-checked on every run.</text>
    <g font-size="14" font-weight="600" fill="#d0d7de">
      <rect x="64" y="304" width="84" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/><text x="106" y="326" text-anchor="middle">185 MB</text>
      <rect x="160" y="304" width="143" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/><text x="231" y="326" text-anchor="middle">22.04 + 24.04</text>
      <rect x="315" y="304" width="126" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/><text x="378" y="326" text-anchor="middle">boot-tested</text>
    </g>
  </g>
  <g transform="translate(700 56)">
    <rect width="516" height="308" rx="12" fill="#0b0f14" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect width="516" height="38" rx="12" fill="#ffffff" fill-opacity="0.05"/>
    <circle cx="22" cy="19" r="6" fill="#f85149" fill-opacity="0.85"/>
    <circle cx="42" cy="19" r="6" fill="#d29922" fill-opacity="0.85"/>
    <circle cx="62" cy="19" r="6" fill="#3fb950" fill-opacity="0.85"/>
    <text x="258" y="24" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">ci: build, boot, measure</text>
    <g font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#8b949e">
      <text x="22" y="76" xml:space="preserve"><tspan fill="#8b949e">== </tspan><tspan fill="#e6edf3">debootstrap noble (minbase)</tspan></text>
      <text x="22" y="102" xml:space="preserve"><tspan fill="#8b949e">== </tspan><tspan fill="#e6edf3">upgrade from noble-updates</tspan></text>
      <text x="22" y="128" xml:space="preserve"><tspan fill="#8b949e">   118 packages, </tspan><tspan fill="#3fb950">185 MB</tspan></text>
      <text x="22" y="154" xml:space="preserve"><tspan fill="#8b949e">== </tspan><tspan fill="#e6edf3">boot in QEMU</tspan></text>
      <text x="22" y="180" xml:space="preserve"><tspan fill="#8b949e">   systemd state: </tspan><tspan fill="#3fb950">running</tspan></text>
      <text x="22" y="206" xml:space="preserve"><tspan fill="#8b949e">== </tspan><tspan fill="#e6edf3">budget</tspan></text>
      <text x="22" y="232" xml:space="preserve"><tspan fill="#3fb950">   every number within its limit</tspan></text>
    </g>
  </g>
  </g>
</svg>
